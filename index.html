<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Kids Health Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f3;
      --bg-tertiary: #efefec;
      --text-primary: #1a1a1a;
      --text-secondary: #6b6b67;
      --text-tertiary: #9e9e9a;
      --border-light: rgba(0,0,0,0.1);
      --border-mid: rgba(0,0,0,0.18);
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --blue: #378add;
      --blue-bg: #E6F1FB;
      --blue-text: #0C447C;
      --green-bg: #EAF3DE;
      --green-text: #27500A;
      --green: #639922;
      --pink-bg: #FBEAF0;
      --pink-text: #72243E;
      --pink: #d4537e;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1e1e1c;
        --bg-secondary: #2a2a28;
        --bg-tertiary: #333330;
        --text-primary: #f0f0ee;
        --text-secondary: #a0a09c;
        --text-tertiary: #6a6a66;
        --border-light: rgba(255,255,255,0.1);
        --border-mid: rgba(255,255,255,0.18);
        --blue-bg: #0c2a44;
        --blue-text: #85b7eb;
        --green-bg: #162a07;
        --green-text: #97c459;
        --pink-bg: #2a0e1a;
        --pink-text: #ed93b1;
      }
    }

    html { font-family: var(--font); background: var(--bg-tertiary); color: var(--text-primary); }

    body {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: 0;
    }

    .app {
      width: 100%;
      max-width: 480px;
      background: var(--bg-tertiary);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 0;
    }

    /* TOP BAR */
    .topbar {
      background: var(--bg-primary);
      border-bottom: 0.5px solid var(--border-light);
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--blue-bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .topbar-info { flex: 1; }
    .topbar-name { font-size: 17px; font-weight: 500; color: var(--text-primary); }
    .topbar-date { font-size: 12px; color: var(--text-secondary); margin-top: 1px; }
    .edit-name-btn {
      background: none; border: 0.5px solid var(--border-light);
      border-radius: var(--radius-md); padding: 6px 10px;
      font-size: 12px; color: var(--text-secondary); cursor: pointer;
    }

    /* SCROLL CONTENT */
    .scroll-area { flex: 1; overflow-y: auto; padding: 14px 14px 100px; }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%; max-width: 480px;
      background: var(--bg-primary);
      border-top: 0.5px solid var(--border-light);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 8px 8px max(8px, env(safe-area-inset-bottom));
      gap: 4px;
      z-index: 10;
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 8px 4px; border: none; border-radius: var(--radius-md);
      background: transparent; cursor: pointer; color: var(--text-secondary);
      font-size: 11px; font-weight: 500; transition: all 0.15s;
    }
    .nav-btn .ni { font-size: 22px; line-height: 1; }
    .nav-btn.active { background: var(--blue-bg); color: var(--blue-text); }

    /* TABS */
    .tab-page { display: none; }
    .tab-page.active { display: block; }

    /* SECTION LABELS */
    .slbl {
      font-size: 11px; font-weight: 600; color: var(--text-secondary);
      letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; margin-top: 16px;
    }
    .slbl:first-child { margin-top: 0; }

    /* QUICK GRID */
    .qgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .qbtn {
      padding: 16px 8px; border: 0.5px solid var(--border-light);
      border-radius: var(--radius-xl); background: var(--bg-primary);
      cursor: pointer; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      transition: transform 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .qbtn:active { transform: scale(0.95); }
    .qbtn .qi { font-size: 32px; line-height: 1; }
    .qbtn .ql { font-size: 14px; font-weight: 500; color: var(--text-primary); }
    .qbtn .qs { font-size: 11px; color: var(--text-secondary); }
    .qbtn.water { border-color: #B5D4F4; background: var(--blue-bg); }
    .qbtn.food  { border-color: #C0DD97; background: var(--green-bg); }
    .qbtn.med   { border-color: #F4C0D1; background: var(--pink-bg); }

    /* FORM CARD */
    .form-card {
      background: var(--bg-primary); border: 0.5px solid var(--border-light);
      border-radius: var(--radius-xl); padding: 16px; margin-top: 8px;
    }
    .form-card select,
    .form-card input[type=text],
    .form-card input[type=number],
    .form-card input[type=time] {
      width: 100%; padding: 12px 14px;
      border: 0.5px solid var(--border-light);
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 16px; font-family: var(--font);
      margin-bottom: 10px; outline: none;
      -webkit-appearance: none;
    }
    .form-card select { appearance: none; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .form-row input { margin-bottom: 0; }
    .add-btn {
      width: 100%; padding: 14px;
      border: none; border-radius: var(--radius-lg);
      background: var(--blue); color: #fff;
      font-size: 16px; font-weight: 500; font-family: var(--font);
      cursor: pointer; margin-top: 6px;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }
    .add-btn:active { opacity: 0.8; }

    /* STATS */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat {
      background: var(--bg-primary); border-radius: var(--radius-xl);
      padding: 16px 14px; text-align: center;
    }
    .stat-num { font-size: 28px; font-weight: 500; }
    .stat-lbl { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
    .stat.wide {
      grid-column: span 2; display: flex; align-items: center; gap: 14px;
      text-align: left; padding: 14px 16px;
    }
    .stat.wide .stat-num { font-size: 24px; }
    .wbar-wrap {
      flex: 1; background: var(--border-light);
      border-radius: 999px; height: 10px; overflow: hidden;
    }
    .wbar { height: 100%; border-radius: 999px; background: var(--blue); transition: width 0.4s; }

    /* ENTRIES */
    .entries-list { display: flex; flex-direction: column; gap: 6px; }
    .entry {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; background: var(--bg-primary);
      border-radius: var(--radius-lg);
    }
    .edot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .emain { flex: 1; min-width: 0; }
    .ename {
      font-size: 14px; font-weight: 500; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .etime { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
    .edel {
      background: none; border: none; cursor: pointer;
      color: var(--text-tertiary); font-size: 18px; padding: 4px; flex-shrink: 0;
      line-height: 1;
    }
    .no-data {
      font-size: 14px; color: var(--text-secondary); text-align: center;
      padding: 2.5rem 1rem; border: 0.5px dashed var(--border-light);
      border-radius: var(--radius-xl);
    }

    /* CALENDAR */
    .cal-nav {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .cal-nav-btn {
      background: var(--bg-primary); border: 0.5px solid var(--border-light);
      border-radius: var(--radius-md); width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 20px; color: var(--text-primary);
    }
    .cal-nav span { font-size: 16px; font-weight: 500; }
    .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
    .cal-hdr { text-align: center; font-size: 10px; font-weight: 600; color: var(--text-secondary); padding: 5px 0; }
    .cal-day {
      aspect-ratio: 1; border-radius: var(--radius-md);
      border: 0.5px solid var(--border-light);
      cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: var(--bg-primary); transition: transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .cal-day:active { transform: scale(0.9); }
    .cal-day.today { border: 1.5px solid var(--blue); }
    .cal-day.sel { background: var(--bg-secondary); }
    .cal-day.empty { background: transparent; border-color: transparent; cursor: default; }
    .cal-day-n { font-size: 12px; color: var(--text-primary); }
    .cal-dots { display: flex; gap: 2px; margin-top: 2px; }
    .cdot { width: 5px; height: 5px; border-radius: 50%; }
    .day-detail {
      background: var(--bg-secondary); border-radius: var(--radius-xl);
      padding: 16px; margin-top: 12px;
    }
    .dd-title { font-size: 15px; font-weight: 500; margin-bottom: 8px; }
    .dd-summary { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .dpill {
      font-size: 12px; font-weight: 500; padding: 4px 12px;
      border-radius: 999px;
    }
    .dpill.water { background: var(--blue-bg); color: var(--blue-text); }
    .dpill.food  { background: var(--green-bg); color: var(--green-text); }
    .dpill.medicine { background: var(--pink-bg); color: var(--pink-text); }

    /* TOAST */
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: var(--text-primary); color: var(--bg-primary);
      border-radius: 999px; padding: 10px 20px;
      font-size: 14px; font-weight: 500;
      opacity: 0; transition: opacity 0.2s; pointer-events: none;
      white-space: nowrap; z-index: 100;
    }
    .toast.show { opacity: 1; }

    /* NAME EDIT MODAL */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.4); z-index: 200;
      align-items: center; justify-content: center;
      padding: 24px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--bg-primary); border-radius: var(--radius-xl);
      padding: 24px; width: 100%; max-width: 340px;
    }
    .modal h3 { font-size: 17px; font-weight: 500; margin-bottom: 14px; }
    .modal input {
      width: 100%; padding: 12px 14px;
      border: 0.5px solid var(--border-mid); border-radius: var(--radius-md);
      background: var(--bg-secondary); color: var(--text-primary);
      font-size: 16px; font-family: var(--font); outline: none;
      margin-bottom: 12px;
    }
    .modal-btns { display: flex; gap: 8px; }
    .modal-btns button {
      flex: 1; padding: 12px; border-radius: var(--radius-md);
      font-size: 14px; font-weight: 500; font-family: var(--font); cursor: pointer;
    }
    .modal-cancel { background: var(--bg-secondary); border: 0.5px solid var(--border-light); color: var(--text-secondary); }
    .modal-save   { background: var(--blue); border: none; color: #fff; }
  </style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="avatar">🧒</div>
    <div class="topbar-info">
      <div class="topbar-name" id="topbar-name">My little one</div>
      <div class="topbar-date" id="topbar-date"></div>
    </div>
    <button class="edit-name-btn" onclick="openNameModal()">Edit name</button>
  </div>

  <div class="scroll-area">

    <!-- LOG TAB -->
    <div id="tab-log" class="tab-page active">
      <p class="slbl">Quick add</p>
      <div class="qgrid">
        <button class="qbtn water" onclick="quickAdd('water','Water glass','250')">
          <span class="qi">💧</span><span class="ql">Water</span><span class="qs">250 ml</span>
        </button>
        <button class="qbtn water" onclick="quickAdd('water','Water bottle','500')">
          <span class="qi">🍼</span><span class="ql">Bottle</span><span class="qs">500 ml</span>
        </button>
        <button class="qbtn food" onclick="quickAdd('food','Snack','')">
          <span class="qi">🍎</span><span class="ql">Snack</span><span class="qs">food</span>
        </button>
        <button class="qbtn med" onclick="quickAdd('medicine','Medicine','')">
          <span class="qi">💊</span><span class="ql">Medicine</span><span class="qs">log it</span>
        </button>
      </div>

      <p class="slbl">Custom entry</p>
      <div class="form-card">
        <select id="log-type" onchange="onTypeChg()">
          <option value="water">💧 Water</option>
          <option value="food">🍽️ Food</option>
          <option value="medicine">💊 Medicine</option>
        </select>
        <input type="text" id="log-name" placeholder="Description (e.g. Breakfast, Calpol)" />
        <div class="form-row">
          <input type="number" id="log-amount" placeholder="Amount / dose" />
          <input type="time" id="log-time" />
        </div>
        <button class="add-btn" onclick="logEntry()">Add entry</button>
      </div>
    </div>

    <!-- TODAY TAB -->
    <div id="tab-today" class="tab-page">
      <div class="stats-grid">
        <div class="stat">
          <div class="stat-num" id="sw" style="color:#185fa5">0</div>
          <div class="stat-lbl">ml water</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="sf" style="color:#3b6d11">0</div>
          <div class="stat-lbl">meals / snacks</div>
        </div>
        <div class="stat wide">
          <div>
            <div class="stat-num" id="sm" style="color:#993556">0</div>
            <div class="stat-lbl">medicines</div>
          </div>
          <div style="flex:1">
            <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-secondary);margin-bottom:5px">
              <span>Daily water goal (1200ml)</span><span id="wpct">0%</span>
            </div>
            <div class="wbar-wrap"><div class="wbar" id="wbar" style="width:0%"></div></div>
          </div>
        </div>
      </div>
      <p class="slbl" style="margin-top:18px">Today's log</p>
      <div class="entries-list" id="today-list"></div>
    </div>

    <!-- CALENDAR TAB -->
    <div id="tab-calendar" class="tab-page">
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="calPrev()">&#8249;</button>
        <span id="cal-lbl"></span>
        <button class="cal-nav-btn" onclick="calNext()">&#8250;</button>
      </div>
      <div class="cal-grid" id="cal-hdrs"></div>
      <div class="cal-grid" id="cal-grid" style="margin-top:3px"></div>
      <div id="day-detail" style="display:none" class="day-detail">
        <div class="dd-title" id="dd-title"></div>
        <div class="dd-summary" id="dd-summary"></div>
        <div class="entries-list" id="dd-entries"></div>
      </div>
    </div>

  </div><!-- /scroll-area -->

  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('log')"><span class="ni">✏️</span>Log</button>
    <button class="nav-btn" onclick="switchTab('today')"><span class="ni">📊</span>Today</button>
    <button class="nav-btn" onclick="switchTab('calendar')"><span class="ni">📅</span>Calendar</button>
  </nav>

</div><!-- /app -->

<!-- NAME MODAL -->
<div class="modal-overlay" id="name-modal">
  <div class="modal">
    <h3>Child's name</h3>
    <input type="text" id="name-input" placeholder="e.g. Sophia, Amir…" maxlength="30" />
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeNameModal()">Cancel</button>
      <button class="modal-save" onclick="saveName()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const GOAL = 1200;
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DAYS_S = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  const DOTS = { water:'#378add', food:'#639922', medicine:'#d4537e' };

  let entries = [];
  let calDate = new Date();
  let childName = 'My little one';

  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function nowTime(){ const n=new Date(); return n.toTimeString().slice(0,5); }
  function fmtDate(d){ return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}); }

  function load(){
    try { entries = JSON.parse(localStorage.getItem('kht-entries') || '[]'); } catch(e){ entries=[]; }
    childName = localStorage.getItem('kht-name') || 'My little one';
  }
  function save(){ localStorage.setItem('kht-entries', JSON.stringify(entries)); }

  function init(){
    load();
    document.getElementById('topbar-name').textContent = childName;
    document.getElementById('topbar-date').textContent = fmtDate(new Date());
    document.getElementById('log-time').value = nowTime();
    renderToday();
  }

  function quickAdd(type, name, amount){
    entries.push({ id:Date.now(), type, name, amount, time:nowTime(), date:todayStr() });
    save(); toast('Logged: '+name); renderToday();
  }

  function logEntry(){
    const type = document.getElementById('log-type').value;
    const name = document.getElementById('log-name').value.trim() || (type==='water'?'Water':type==='food'?'Meal':'Medicine');
    const amount = document.getElementById('log-amount').value.trim();
    const time = document.getElementById('log-time').value || nowTime();
    entries.push({ id:Date.now(), type, name, amount, time, date:todayStr() });
    save();
    document.getElementById('log-name').value = '';
    document.getElementById('log-amount').value = '';
    toast('Entry added!'); renderToday();
  }

  function onTypeChg(){
    const t = document.getElementById('log-type').value;
    document.getElementById('log-amount').placeholder =
      t==='water' ? 'Amount (ml)' : t==='medicine' ? 'Dose (e.g. 5ml)' : 'Optional note';
  }

  function delEntry(id){
    entries = entries.filter(e => e.id !== id);
    save(); renderToday();
    if(document.getElementById('tab-calendar').classList.contains('active')) renderCal();
  }

  function entryHTML(e, showDel){
    const amtStr = e.amount ? (e.type==='water' ? ' · '+e.amount+'ml' : ' · '+e.amount) : '';
    const del = showDel ? `<button class="edel" onclick="delEntry(${e.id})">✕</button>` : '';
    return `<div class="entry">
      <div class="edot" style="background:${DOTS[e.type]}"></div>
      <div class="emain">
        <div class="ename">${e.name}${amtStr}</div>
        <div class="etime">${e.time}</div>
      </div>${del}
    </div>`;
  }

  function renderToday(){
    const td = todayStr();
    const te = entries.filter(e=>e.date===td).sort((a,b)=>a.time.localeCompare(b.time));
    const wml = te.filter(e=>e.type==='water').reduce((s,e)=>s+(parseInt(e.amount)||0),0);
    document.getElementById('sw').textContent = wml;
    document.getElementById('sf').textContent = te.filter(e=>e.type==='food').length;
    document.getElementById('sm').textContent = te.filter(e=>e.type==='medicine').length;
    const pct = Math.min(100, Math.round(wml/GOAL*100));
    document.getElementById('wbar').style.width = pct+'%';
    document.getElementById('wpct').textContent = pct+'%';
    const el = document.getElementById('today-list');
    el.innerHTML = te.length ? te.map(e=>entryHTML(e,true)).join('') : '<div class="no-data">Nothing logged yet today</div>';
  }

  function renderCal(){
    const y=calDate.getFullYear(), m=calDate.getMonth();
    document.getElementById('cal-lbl').textContent = MONTHS[m]+' '+y;
    document.getElementById('cal-hdrs').innerHTML = DAYS_S.map(d=>`<div class="cal-hdr">${d}</div>`).join('');
    const first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();
    const today=todayStr(); let html='';
    for(let i=0;i<first;i++) html+='<div class="cal-day empty"></div>';
    for(let d=1;d<=days;d++){
      const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      const de=entries.filter(e=>e.date===ds);
      const types=[...new Set(de.map(e=>e.type))];
      const dots=types.map(t=>`<div class="cdot" style="background:${DOTS[t]}"></div>`).join('');
      html+=`<div class="cal-day${ds===today?' today':''}" onclick="showDay('${ds}')">
        <span class="cal-day-n">${d}</span>
        <div class="cal-dots">${dots}</div>
      </div>`;
    }
    document.getElementById('cal-grid').innerHTML = html;
  }

  function showDay(ds){
    const de=entries.filter(e=>e.date===ds).sort((a,b)=>a.time.localeCompare(b.time));
    const dd=document.getElementById('day-detail');
    dd.style.display='block';
    document.getElementById('dd-title').textContent = fmtDate(new Date(ds+'T12:00:00'));
    if(!de.length){
      document.getElementById('dd-summary').innerHTML='';
      document.getElementById('dd-entries').innerHTML='<div class="no-data">Nothing logged this day</div>';
      return;
    }
    const wml=de.filter(e=>e.type==='water').reduce((s,e)=>s+(parseInt(e.amount)||0),0);
    const fc=de.filter(e=>e.type==='food').length;
    const mc=de.filter(e=>e.type==='medicine').length;
    let summ='';
    if(wml) summ+=`<span class="dpill water">💧 ${wml}ml</span>`;
    if(fc)  summ+=`<span class="dpill food">🍽️ ${fc} meal${fc>1?'s':''}</span>`;
    if(mc)  summ+=`<span class="dpill medicine">💊 ${mc} dose${mc>1?'s':''}</span>`;
    document.getElementById('dd-summary').innerHTML=summ;
    document.getElementById('dd-entries').innerHTML=de.map(e=>entryHTML(e,false)).join('');
  }

  function calPrev(){ calDate.setMonth(calDate.getMonth()-1); renderCal(); document.getElementById('day-detail').style.display='none'; }
  function calNext(){ calDate.setMonth(calDate.getMonth()+1); renderCal(); document.getElementById('day-detail').style.display='none'; }

  function switchTab(name){
    document.querySelectorAll('.nav-btn').forEach((b,i)=>b.classList.toggle('active',['log','today','calendar'][i]===name));
    document.querySelectorAll('.tab-page').forEach(p=>p.classList.remove('active'));
    document.getElementById('tab-'+name).classList.add('active');
    if(name==='today') renderToday();
    if(name==='calendar') renderCal();
  }

  function toast(msg){
    const t=document.getElementById('toast');
    t.textContent=msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2000);
  }

  function openNameModal(){
    document.getElementById('name-input').value = childName;
    document.getElementById('name-modal').classList.add('show');
    setTimeout(()=>document.getElementById('name-input').focus(), 50);
  }
  function closeNameModal(){ document.getElementById('name-modal').classList.remove('show'); }
  function saveName(){
    const v = document.getElementById('name-input').value.trim();
    if(v){ childName=v; localStorage.setItem('kht-name',v); document.getElementById('topbar-name').textContent=v; }
    closeNameModal();
  }
  document.getElementById('name-modal').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeNameModal(); });
  document.getElementById('name-input').addEventListener('keydown', e=>{ if(e.key==='Enter') saveName(); });

  init();
</script>
</body>
</html>
